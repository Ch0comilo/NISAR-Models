[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "nisar-water"
version = "0.1.0"
description = "Headless NISAR open-water segmentation and comparable observation time series"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = [
  "numpy==2.3.5",
  "scipy==1.16.3",
  "scikit-learn==1.7.2",
  "rasterio==1.5.2",
  "shapely==2.1.2",
  "pyproj==3.7.2",
  "Pillow==10.4.0",
  "xarray>=2025.1,<2027",
  "h5py==3.14.0",
  "joblib>=1.4,<2",
  "fastapi==0.115.0",
  "uvicorn==0.30.0",
  "requests>=2.32,<3",
]

[project.optional-dependencies]
test = ["pytest==9.0.3", "httpx==0.27.0"]
notebook = ["nbformat>=5.10,<6", "nbclient>=0.10,<1", "ipykernel>=6.29,<8", "matplotlib>=3.10,<4", "requests>=2.32,<3", "jupyterlab>=4.4,<5"]
earthengine = [
    "earthengine-api>=1.5,<2",
]

[project.scripts]
nisar-water = "nisar_water.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/nisar_water"]

[tool.pytest.ini_options]
testpaths = ["tests"]

